      border-color: rgba(16, 185, 129, 0.8);
    }

    /* Gran Brillo Verde Animado para Éxito */
    @keyframes green-glow-pulse {

      }

    .glow-green-super {

    }

    .glow-green-text {

    .scanline {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;

      background: linear-gradient(

    @keyframes pulse-fast {
      0%, 100% { opacity: 1; }

    }
    .animate-pulse-fast {

    }

    .clip-corner {
      clip-path: polygon(
        0 15px, 
        15px 0, 
        calc(100% - 15px) 0, 
        100% 15px, 
        100% calc(100% - 15px), 
        calc(100% - 15px) 100%, 
        15px 100%, 
        0 calc(100% - 15px)

    .clip-button {

  <script>
    lucide.createIcons();

    const CORRECT_PIN = "3435";
    const VIDEO_INTRO = "https://fabiolachr.github.io/CosasVarias/CumpleAlex2026/Videos/M1_PRESENTACION_XimenaRueda.mp4";
    const VIDEO_CORRECT = "https://fabiolachr.github.io/CosasVarias/CumpleAlex2026/Videos/M1_CORRECTO_XimenaRueda.mp4";
    const VIDEO_INCORRECT = "https://fabiolachr.github.io/CosasVarias/CumpleAlex2026/Videos/M1_INCORRECTO_XimenaRueda.mp4";
    const NEXT_MISSION_URL = "https://fabiolachr.github.io/CosasVarias/CumpleAlex2026/HUB.html";

    let audioCtx = null;
    let nextMissionTimer = null;

    // Función para registrar la finalización en LocalStorage para el HUB Central
    function registrarMisionCompletada() {
      const KEY = 'terraformacionMarte';
      let estadoActual = { oxigeno: false, temperatura: false, agua: false, victoriaMostrada: false };
      
      try {
        const guardado = localStorage.getItem(KEY);
        if (guardado) {
          estadoActual = { ...estadoActual, ...JSON.parse(guardado) };
        }
      } catch (e) {
        console.error("Error al leer localStorage", e);
      }

      estadoActual.oxigeno = true;

      try {
        localStorage.setItem(KEY, JSON.stringify(estadoActual));
      } catch (e) {
        console.error("Error al guardar en localStorage", e);
      }
    }

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playKeyPressSound() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(850, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1400, ctx.currentTime + 0.08);

        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch(e) {}
    }

    function playClearSound() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(450, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.12);

        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch(e) {}
    }

    function playResetSound() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1200, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(250, ctx.currentTime + 0.25);

        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch(e) {}
    }

    function playSuccessSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);

          gain.gain.setValueAtTime(0, now + idx * 0.08);
          gain.gain.linearRampToValueAtTime(0.2, now + idx * 0.08 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.4);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.4);
        });

        const subOsc = ctx.createOscillator();
        const subGain = ctx.createGain();
        subOsc.type = 'sawtooth';
        subOsc.frequency.setValueAtTime(140, now);
        subOsc.frequency.exponentialRampToValueAtTime(50, now + 0.9);

        subGain.gain.setValueAtTime(0.25, now);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);

        subOsc.connect(subGain);
        subGain.connect(ctx.destination);

        subOsc.start(now);
        subOsc.stop(now + 0.9);
      } catch(e) {}
    }

    function playErrorSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        for (let i = 0; i < 2; i++) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(160, now + i * 0.18);

          gain.gain.setValueAtTime(0.2, now + i * 0.18);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.18 + 0.15);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now + i * 0.18);
          osc.stop(now + i * 0.18 + 0.15);
        }
      } catch(e) {}
    }

    const introOverlay = document.getElementById('intro-overlay');
    const introStartScreen = document.getElementById('intro-start-screen');
    const introVideoContainer = document.getElementById('intro-video-container');
    const introVideo = document.getElementById('intro-video');

    function startIntro() {
      playKeyPressSound();
      introStartScreen.classList.add('hidden');
      introVideoContainer.classList.remove('hidden');
      introVideo.play().catch(e => {
        console.log("Error al reproducir el video de presentación:", e);
        closeIntro();
      });
    }

    introVideo.addEventListener('ended', () => {
      closeIntro();
    });

    function closeIntro() {
      playKeyPressSound();
      introVideo.pause();
      introOverlay.classList.add('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        introOverlay.classList.add('hidden');
      }, 700);
    }

    let currentPin = "";
    let isLocked = false;

    const pinDigits = document.querySelectorAll('.pin-digit');
    const instructionText = document.getElementById('instruction-text');
    const messageText = document.getElementById('message-text');
    const screenContainer = document.getElementById('screen-container');
    const pinDisplayView = document.getElementById('pin-display-view');
    const mediaView = document.getElementById('media-view');
    const statusVideo = document.getElementById('status-video');
    const videoSource = document.getElementById('video-source');
    const statusTag = document.getElementById('status-tag');
    const containerCard = document.getElementById('container-card');
    const headerIconBox = document.getElementById('header-icon-box');
    const panelNextMissionContainer = document.getElementById('panel-next-mission-container');
    const fullscreenNextBtnContainer = document.getElementById('fullscreen-next-btn-container');

    const fullscreenOverlay = document.getElementById('fullscreen-overlay');
    const fullscreenVideo = document.getElementById('fullscreen-video');
    const fullscreenVideoSource = document.getElementById('fullscreen-video-source');

    function pressKey(num) {
      if (isLocked || currentPin.length >= 4) return;

      playKeyPressSound();

      currentPin += num;
      updateDisplay();

      if (currentPin.length === 4) {
        verifyPin();
      }
    }

    function clearPin() {
      if (isLocked) return;
      playClearSound();
      currentPin = "";
      updateDisplay();
      messageText.textContent = "ESPERANDO PINES DE ACCESO...";
      messageText.className = "text-sm font-orbitron text-cyan-400/80 tracking-widest min-h-[20px] text-center";
    }

    function updateDisplay() {
      pinDigits.forEach((digitEl, index) => {
        if (index < currentPin.length) {
          digitEl.textContent = currentPin[index];
          digitEl.classList.add('border-cyan-400', 'text-cyan-300', 'bg-cyan-950/30');
          digitEl.classList.remove('border-cyan-500/50');
        } else {
          digitEl.textContent = "";
          digitEl.classList.remove('border-cyan-400', 'text-cyan-300', 'bg-cyan-950/30', 'border-emerald-400', 'bg-emerald-950/50', 'text-emerald-300');
          digitEl.classList.add('border-cyan-500/50');
        }
      });
    }

    function verifyPin() {
      isLocked = true;

      if (currentPin === CORRECT_PIN) {
        // REGISTRO DE MISIÓN EN LOCALSTORAGE PARA EL HUB
        registrarMisionCompletada();

        playSuccessSound();

        messageText.textContent = "CONTRASEÑA CORRECTA - GENERADORES OPERANDO";
        messageText.className = "text-sm font-orbitron text-emerald-300 font-bold tracking-widest min-h-[20px] text-center glow-green-text";
        statusTag.textContent = "PERMITIDO";
        statusTag.className = "text-emerald-400 font-bold glow-green-text";

        containerCard.classList.remove('glow-cyan');
        containerCard.classList.add('glow-green-super');

        screenContainer.classList.add('screen-success-glow');

        headerIconBox.className = "inline-flex items-center justify-center p-3 bg-emerald-950/80 border border-emerald-400 rounded-full mb-3 text-emerald-300 shadow-[0_0_20px_rgba(16,185,129,0.8)]";

        pinDigits.forEach(el => {
          el.classList.remove('border-cyan-400', 'text-cyan-300', 'bg-cyan-950/30', 'border-cyan-500/50');
          el.classList.add('border-emerald-400', 'text-emerald-300', 'bg-emerald-950/60', 'glow-green-text');
        });

        // Lanzar el video de éxito en pantalla completa tras 3 segundos
        setTimeout(() => {
          showFullscreenMedia(VIDEO_CORRECT);
        }, 3000);

      } else {
        playErrorSound();

        messageText.textContent = "¡DENEGADO! CLAVE ERRÓNEA";
        messageText.className = "text-sm font-orbitron text-red-500 font-bold tracking-widest min-h-[20px] text-center animate-bounce";
        statusTag.textContent = "ALERTA";
        statusTag.className = "text-red-500 font-bold";

        containerCard.classList.remove('glow-cyan');
        containerCard.classList.add('glow-red');

        pinDigits.forEach(el => {
          el.classList.add('border-red-500', 'text-red-500', 'bg-red-950/40');
        });

        setTimeout(() => {
          showMedia(VIDEO_INCORRECT);
        }, 600);
      }
    }

    function showMedia(url) {
      videoSource.src = url;
      statusVideo.load();
      statusVideo.play().catch(e => console.log("Error al reproducir video:", e));

      pinDisplayView.classList.add('hidden');
      mediaView.classList.remove('hidden');
    }

    function showFullscreenMedia(url) {
      fullscreenVideoSource.src = url;
      fullscreenVideo.load();
      fullscreenOverlay.classList.remove('hidden');

      // Ocultar el botón al iniciar la reproducción
      fullscreenNextBtnContainer.classList.add('hidden');

      fullscreenVideo.play().catch(e => console.log("Error al reproducir video fullscreen:", e));

      // Si es el video final de éxito, programar la aparición del botón 30 segundos después
      if (url === VIDEO_CORRECT) {
        if (nextMissionTimer) clearTimeout(nextMissionTimer);
        
        nextMissionTimer = setTimeout(() => {
          fullscreenNextBtnContainer.classList.remove('hidden');
          panelNextMissionContainer.classList.remove('hidden');
        }, 30000); // 30 segundos (30000 ms)
      }
    }

    function closeFullscreenVideo() {
      playKeyPressSound();
      fullscreenVideo.pause();
      fullscreenOverlay.classList.add('hidden');
    }

    function resetApp() {
      playResetSound();
      currentPin = "";
      isLocked = false;

      if (nextMissionTimer) {
        clearTimeout(nextMissionTimer);
        nextMissionTimer = null;
      }

      statusVideo.pause();
      videoSource.src = "";

      fullscreenVideo.pause();
      fullscreenVideoSource.src = "";
      fullscreenOverlay.classList.add('hidden');

      pinDisplayView.classList.remove('hidden');
      mediaView.classList.add('hidden');
      panelNextMissionContainer.classList.add('hidden');
      fullscreenNextBtnContainer.classList.add('hidden');

      statusTag.textContent = "ESPERA";
      statusTag.className = "text-cyan-400";

      messageText.textContent = "ESPERANDO PINES DE ACCESO...";
      messageText.className = "text-sm font-orbitron text-cyan-400/80 tracking-widest min-h-[20px] text-center";

      containerCard.classList.remove('glow-green', 'glow-green-super', 'glow-red');
      containerCard.classList.add('glow-cyan');

      screenContainer.classList.remove('screen-success-glow');

      headerIconBox.className = "inline-flex items-center justify-center p-3 bg-cyan-950/50 border border-cyan-500/30 rounded-full mb-3 text-cyan-400 transition-all duration-300";

      updateDisplay();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') {
        pressKey(e.key);
      } else if (e.key === 'Backspace') {
        clearPin();
      } else if (e.key === 'Escape') {
        resetApp();
      }
    });
  </script>
</body>
</html>
